.fr b{font-weight:inherit;border-bottom:2px solid currentColor;padding:0 5px}
.fr i{font-style:normal;padding:0 5px}
.mx{display:inline-flex;flex-wrap:wrap;direction:rtl;align-items:center;gap:.15em .3em;vertical-align:middle}
.it{display:inline-flex;align-items:center}
.sg{display:inline-flex;align-items:center;gap:.1em}
.pw{display:inline-block;direction:ltr;unicode-bidi:isolate}
.pw sup{font-size:.65em;line-height:0;vertical-align:super;margin-right:1px;direction:rtl;unicode-bidi:isolate}

</style>

const app=document.getElementById("app");
const NL=16,sel=new Set([...Array(NL).keys()]);
let cnt=10,Q=[],qi=0,sc=0,locked=false,OP=[];

function all(){sel.clear();for(let i=0;i<NL;i++)sel.add(i);setup()}
function ch(a){sel.clear();for(let i=a;i<a+8;i++)sel.add(i);setup()}
function tg(i){if(sel.has(i)){if(sel.size>1)sel.delete(i)}else sel.add(i);setup()}
function setup(){
  const pool=[...sel].reduce((t,i)=>t+L[i].length+(G[i]?GL.length:0),0);
  if(cnt>pool)cnt=pool;
  const opts=[5,10,15,20,30,40,50,100].filter(x=>x<pool);opts.push(pool);
  app.className="";app.innerHTML=`${brand()}<h1>الفصلان ١ و٢: الجبر والدوال – الأعداد الصحيحة</h1>
  <div class="sub">أول متوسط · اختيار من متعدد · الأسئلة مرتبة من السهل إلى الصعب</div>
  <div class="card"><b>١. اختر درسًا أو أكثر</b>

function start(){
  const p=[];
  sel.forEach(i=>{const seen=new Set();L[i].forEach(q=>{seen.add(q[0]);p.push({i,q,lv:q[3]})});
    if(G[i])GL.forEach(lv=>{let q;for(let t=0;t<8;t++){q=G[i](lv);if(!seen.has(q[0]))break}seen.add(q[0]);p.push({i,q,lv})})});

function show(){

  <div class="qb"><div class="q">${f(q[0])}</div><div class="opts">${OP.map((x,k)=>`<button class="opt" onclick="pick(${k},this)">${f(x[0])}</button>`).join('')}</div></div>
  <button class="btn" id="nb" disabled onclick="nx()">${qi<Q.length-1?'السؤال التالي':'عرض النتيجة'}</button></div>`;
}
function pick(k,el){
  if(locked)return;locked=true;
  if(OP[k][1]){sc++;el.classList.add("ok")}else{el.classList.add("no");document.querySelectorAll(".opt")[OP.findIndex(x=>x[1])].classList.add("ok")}
  document.getElementById("nb").disabled=false;
}
function nx(){qi++;qi<Q.length?show():end()}
function end(){
  const r=sc/Q.length;
  const msg=r==1?"ممتاز! 🌟":r>=.7?"أحسنت 👏":"حاول مرة أخرى، ستتحسن 💪";
  app.className="";app.innerHTML=`${brand()}<div class="card c"><div>نتيجتك</div><div class="big">${ar(sc)} / ${ar(Q.length)}</div><div>${ar(Math.round(r*100))}٪</div><p>${msg}</p>
  <button class="btn" onclick="start()">محاولة جديدة بنفس الاختيار</button>
  <button class="btn g" onclick="setup()">تغيير الدروس أو عدد الأسئلة</button></div>`;
