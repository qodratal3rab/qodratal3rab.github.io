<style>

html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}

.grid{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin:8px 0}
.chip{font:inherit;font-size:.8rem;line-height:1.35;color:var(--tx);background:var(--card);border:2px solid var(--bd);border-radius:12px;padding:6px 6px;cursor:pointer;text-align:center}
.chip.on{background:var(--pr);border-color:var(--pr);color:#fff}
.chip.w{grid-column:1/3}
.row{display:flex;gap:6px;flex-wrap:wrap;margin:8px 0}
.row .chip{min-width:46px;font-size:.95rem}
.bar{height:8px;background:var(--bd);border-radius:6px;overflow:hidden;margin:6px 0 10px}
.bar i{display:block;height:100%;background:var(--pr);transition:width .3s}
.tag{display:inline-block;padding:0 10px;border-radius:20px;font-size:.8rem;color:#fff}
.e{background:#1e8e4e}.m{background:#e08a00}.h{background:#d93025}
.q{font-size:1.1rem;font-weight:600;margin:8px 0 12px;overflow-wrap:anywhere}
.opt{display:block;width:100%;text-align:right;font:inherit;color:inherit;background:var(--card);border:2px solid var(--bd);border-radius:12px;padding:8px 12px;margin-bottom:7px;cursor:pointer;font-size:1.1rem;overflow-wrap:anywhere}
.opt.ok{border-color:var(--ok);background:rgba(30,142,78,.15)}
.opt.no{border-color:var(--no);background:rgba(217,48,37,.15)}
.btn{background:var(--pr);color:#fff;border:0;border-radius:12px;padding:11px 16px;font:inherit;font-weight:600;cursor:pointer;width:100%;margin-top:4px}
.btn.g{background:transparent;color:var(--tx);border:2px solid var(--bd)}
.top{display:flex;justify-content:space-between;align-items:center;color:var(--mu);font-size:.85rem;gap:8px}
.back{background:none;border:0;color:var(--pr);font:inherit;font-weight:600;cursor:pointer;padding:0}
.big{font-size:2.4rem;text-align:center;font-weight:800;color:var(--pr)}
.c{text-align:center}
.fr{display:inline-flex;flex-direction:column;vertical-align:middle;text-align:center;margin:0 3px;line-height:1.25;font-size:.95em}
.fr b{font-weight:inherit;border-bottom:2px solid currentColor;padding:0 5px}
.fr i{font-style:normal;padding:0 5px}
.mx{display:inline-flex;flex-wrap:wrap;direction:rtl;align-items:center;gap:.15em .3em;vertical-align:middle}
.it{display:inline-flex;align-items:center}
.sg{display:inline-flex;align-items:center;gap:.1em}
.pw{display:inline-block;direction:ltr;unicode-bidi:isolate}
.pw sup{font-size:.65em;line-height:0;vertical-align:super;margin-right:1px;direction:rtl;unicode-bidi:isolate}
.rt{display:inline-block;line-height:1.1;direction:rtl}
.rs{display:inline-block;transform:scaleX(-1);font-size:1.1em;vertical-align:bottom}
.rn{display:inline-block;padding:0 3px;border-top:2px solid currentColor}
main.qz{height:100vh;height:100dvh;display:flex;flex-direction:column;overflow:hidden}
.qz .card{flex:1;min-height:0;display:flex;flex-direction:column;margin-bottom:6px}
.qb{flex:1;min-height:0;overflow:auto}.qz .q{margin:4px 0 10px}.qz .bar{margin:4px 0 6px}
.opts{display:grid;gap:7px}.opts .opt{margin:0}@media(min-width:620px){.opts{grid-template-columns:1fr 1fr}}
@media(max-height:700px){.q{font-size:1rem}.opt{padding:5px 10px;font-size:1rem}}
.btn:disabled{opacity:.4;cursor:default}
.brand{display:flex;align-items:center;gap:10px;padding:6px 2px;border-bottom:2px solid var(--pr);margin-bottom:8px}
.brand img,.lgb{width:56px;height:56px;border-radius:50%;object-fit:cover;flex:none}
.lgb{display:grid;place-items:center;background:var(--pr);color:#fff;font-weight:800;font-size:1.3rem}
.brand b{font-size:1rem}.brand small{display:block;color:var(--mu)}.brand a{color:var(--pr);text-decoration:none;direction:ltr;unicode-bidi:isolate}
.brand.sm{padding:2px;margin-bottom:4px}.brand.sm img,.brand.sm .lgb{width:28px;height:28px;font-size:.95rem}
</style>
</head>

/* ===== عرض الرموز: المسألة تُكتب من اليمين لليسار (الحد الأول أقصى اليمين) ===== */
const SUP="⁰¹²³⁴⁵⁶⁷⁸⁹⁻";
const ar=s=>String(s).replace(/\d/g,d=>"٠١٢٣٤٥٦٧٨٩"[d]);
const R=a=>'<span class="mx">'+a.map(h=>'<span class="it">'+h+'</span>').join('')+'</span>';
const tok=s=>{
  const re=/(\d+|\([^()]*\))([⁰¹²³⁴⁵⁶⁷⁸⁹⁻]+)|(\d+)\/(\d+)|(\d+(?:\.\d+)?)|([+−×÷=()…-])/g;
  const o=[];let m,un=false;
  while(m=re.exec(s)){
    let h;
    if(m[2]){const e=[...m[2]].map(c=>c=='⁻'?'−':ar(SUP.indexOf(c))).join('');
      const b=m[1][0]=='('?R(['(',...tok(m[1].slice(1,-1)),')']):ar(m[1]);
      h=`<span class="pw"><sup>${e}</sup>${b}</span>`}
    else if(m[3])h=`<span class="fr"><b>${ar(m[3])}</b><i>${ar(m[4])}</i></span>`;
    else if(m[5])h=ar(m[5]).replace('.','٫');
    else{const c=m[6]=='-'?'−':m[6],pv=o.length?o[o.length-1]:null;
      if(c=='−'&&(!pv||pv.op&&pv.h!=')')){un=true;continue}
      if(un){o.push({h:'−',op:true});un=false}
      o.push({h:c,op:true});continue}
    if(un){h=`<span class="sg">−${h}</span>`;un=false}
    o.push({h,op:false});
  }
  if(un)o.push({h:'−',op:true});
  return o.map(x=>x.h);
};
const math=r=>{const t=r.trimEnd();return R(tok(t))+r.slice(t.length)};
const f=s=>s.replace(/√(\d+)|[−-]?[\d(][\d\s\/.×÷+−\-()⁰¹²³⁴⁵⁶⁷⁸⁹⁻…]*/g,(m,r)=>r?`<span class="rt"><span class="rs">√</span><span class="rn">${ar(r)}</span></span>`:math(m));

/* ===== مولدات الأسئلة (إجاباتها تُحسب برمجيًا) ===== */
const sh=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.random()*(i+1)|0;[a[i],a[j]]=[a[j],a[i]]}return a};
const rnd=(a,b)=>a+Math.floor(Math.random()*(b-a+1)),pk=a=>a[rnd(0,a.length-1)];
const gcd=(a,b)=>b?gcd(b,a%b):Math.abs(a);
const nf=([n,d])=>{if(d<0){n=-n;d=-d}const k=gcd(n,d)||1;return[n/k,d/k]};
const fs=([n,d])=>d==1?""+n:n+"/"+d;

const sup=n=>String(n).replace(/\d/g,d=>SUP[+d]).replace("-","⁻");
const D=v=>String(+v.toFixed(4));

function frW(c,ex=[]){const[a,b]=c;return[[-a,b],[b,a],[a+1,b],[a-1,b],[a,b+1],[a,b*2],[a*2,b+1],[a+2,b],[a-2,b],[1,b+1],[a+1,b*2],...ex].filter(p=>p[1]!=0).map(p=>fs(nf(p)))}
const rf=(mx,dm,sg)=>{let n=rnd(1,mx);if(sg&&Math.random()<.5)n=-n;return nf([n,rnd(2,dm)])};
const IW=(t,c,d)=>mk(t,""+c,[c+1,c-1,c+2,c-2,c+d,c-d,c*2,c+3].filter(x=>x!=c).map(String));

const G=[
lv=>{ // ١-١

lv=>{ // ١-٢
  const big=Math.random()<.5,cmp=(a,b)=>a[0]*b[1]-b[0]*a[1];

lv=>{ // ١-٣
  const sg=lv!="e",mx=lv=="h"?6:9,A=rf(mx,mx,sg),B=rf(mx,mx,sg);

function brand(c){const lg=`<img src="${BR.logo}" alt="">`,n=BR.phone.replace(/\D/g,''),ph=`<a href="tel:${n}">${BR.phone}</a> · <a href="https://wa.me/966${n.replace(/^0/,'')}" target="_blank" rel="noopener">واتساب</a>`;return `<div class="brand${c?' sm':''}">${lg}<div><b>${BR.name}</b>${c?'':`<small>${BR.role}<br>${ph}</small>`}</div></div>`}
/* ===== الواجهة ===== */
const app=document.getElementById("app");
const sel=new Set([0,1,2,3,4,5,6,7,8]);
let cnt=10,Q=[],qi=0,sc=0,locked=false,OP=[];

function all(){sel.clear();for(let i=0;i<9;i++)sel.add(i);setup()}
function tg(i){if(sel.has(i)){if(sel.size>1)sel.delete(i)}else sel.add(i);setup()}
function setup(){
  const pool=sel.size*PER;
  if(cnt>pool)cnt=pool;
  const opts=[5,10,15,20,30,40,50,100].filter(x=>x<pool);opts.push(pool);
  app.className="";app.innerHTML=`${brand()}<h1>الفصل ١: الجبر – الأعداد النسبية</h1>
  <div class="sub">ثاني متوسط · اختيار من متعدد · ${ar(PER)} سؤالًا لكل درس من السهل إلى الصعب</div>
  <div class="card"><b>١. اختر درسًا أو أكثر</b>
  <div class="grid"><button class="chip w ${sel.size==9?'on':''}" onclick="all()">كل الدروس</button>
  ${SH.map((s,i)=>`<button class="chip ${sel.has(i)?'on':''}" onclick="tg(${i})">${N[i]} ${s}</button>`).join('')}</div>
  <div class="sub">الدروس المختارة: ${ar(sel.size)} · الأسئلة المتاحة: ${ar(pool)}</div>
  <b>٢. عدد الأسئلة في المحاولة</b>
  <div class="row">${opts.map(x=>`<button class="chip ${cnt==x?'on':''}" onclick="cnt=${x};setup()">${x==pool&&pool>10?'الكل ':''}${ar(x)}</button>`).join('')}</div>
  <button class="btn" onclick="start()">ابدأ الاختبار</button></div>`;
}
function start(){
  const p=[];
  sel.forEach(i=>{
    const seen=new Set();
    L[i].forEach((q,k)=>{seen.add(q[0]);p.push({i,q,lv:LV[k]})});
    GL.forEach(lv=>{let q;for(let t=0;t<8;t++){q=G[i](lv);if(!seen.has(q[0]))break}seen.add(q[0]);p.push({i,q,lv})});
  });
  Q=sh(p).slice(0,cnt).sort((a,b)=>RK[a.lv]-RK[b.lv]);
  qi=0;sc=0;show();
}
function show(){
  locked=false;
  const o=Q[qi],q=o.q;
  OP=sh(q[1].map((t,k)=>[t,k===q[2]]));
  app.className="qz";
  app.innerHTML=`${brand(1)}<div class="top"><button class="back" onclick="setup()">‹ الدروس</button><span>${N[o.i]} ${SH[o.i]}</span></div>
  <div class="bar"><i style="width:${qi/Q.length*100}%"></i></div>
  <div class="card"><div class="top"><span>السؤال ${ar(qi+1)} من ${ar(Q.length)}</span><span class="tag ${o.lv}">${LN[o.lv]}</span></div>
  <div class="qb"><div class="q">${f(q[0])}</div><div class="opts">${OP.map((x,k)=>`<button class="opt" onclick="pick(${k},this)">${f(x[0])}</button>`).join('')}</div></div>
  <button class="btn" id="nb" disabled onclick="nx()">${qi<Q.length-1?'السؤال التالي':'عرض النتيجة'}</button></div>`;
}
function pick(k,el){
  if(locked)return;locked=true;
  if(OP[k][1]){sc++;el.classList.add("ok")}else{el.classList.add("no");document.querySelectorAll(".opt")[OP.findIndex(x=>x[1])].classList.add("ok")}
  document.getElementById("nb").disabled=false;
}
function nx(){qi++;qi<Q.length?show():end()}
function end(){
  const r=sc/Q.length;
  const msg=r==1?"ممتاز! 🌟":r>=.7?"أحسنت 👏":"حاول مرة أخرى، ستتحسن 💪";
  app.className="";app.innerHTML=`${brand()}<div class="card c"><div>نتيجتك</div><div class="big">${ar(sc)} / ${ar(Q.length)}</div><div>${ar(Math.round(r*100))}٪</div><p>${msg}</p>
  <button class="btn" onclick="start()">محاولة جديدة بنفس الاختيار</button>
  <button class="btn g" onclick="setup()">تغيير الدروس أو عدد الأسئلة</button></div>`;
}
setup();
</script>
